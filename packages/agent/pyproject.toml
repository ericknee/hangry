[project]
name = "agent"
version = "0.1.0"
description = "Hangry search pipeline: Places retrieval, ranking and question selection"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent"]
